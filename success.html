<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#1b1b1b;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:350px;
    box-shadow:0 0 20px rgba(0,255,120,.4);
}

.tick{
    width:120px;
    height:120px;
    background:#22c55e;
    color:white;
    border-radius:50%;
    font-size:70px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
}

h1{
    color:#22c55e;
    margin-top:25px;
}

p{
    color:#ddd;
    font-size:18px;
}

a{
    display:inline-block;
    margin-top:25px;
    text-decoration:none;
    background:#22c55e;
    color:white;
    padding:12px 30px;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="box">

<div class="tick">✓</div>

<h1>Booking Confirmed</h1>

<p>Your appointment has been booked successfully.</p>

<p>Thank you for choosing <b>Pazwa Care</b>.</p>

<a href="index.html">Back to Home</a>

</div>
<script>
const url = localStorage.getItem("whatsappURL");

setTimeout(() => {
    if (url) {
        localStorage.removeItem("whatsappURL");
        window.location.href = url;
    }
}, 2000);
</script>
</body>
</html>
